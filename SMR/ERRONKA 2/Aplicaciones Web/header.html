<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .frame-page {
      overflow: auto;
    }

    .header-page {
      background: #91abd8;
    }

    .site-header {
      display: grid;
      min-height: 100%;
      place-items: center;
      border-bottom: 2px solid #171717;
      color: #101820;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body class="frame-page header-page">
  <header class="site-header">CABECERA</header>
</body>
</html>
