<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web 1.0</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: minmax(170px, 29%) 1fr;
      grid-template-rows: 88px minmax(0, 1fr) 64px;
      gap: 2px;
      min-height: 100vh;
      background: #171717;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
    }

    .header-frame,
    .footer-frame {
      grid-column: 1 / -1;
    }

    .navigation-frame {
      grid-column: 1;
      grid-row: 2;
    }

    .content-frame {
      grid-column: 2;
      grid-row: 2;
    }

    .footer-frame {
      grid-row: 3;
    }

    @media (max-width: 620px) {
      body {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 76px 124px minmax(320px, 1fr) 60px;
      }

      .navigation-frame {
        grid-column: 1;
        grid-row: 2;
      }

      .content-frame {
        grid-column: 1;
        grid-row: 3;
      }

      .footer-frame {
        grid-row: 4;
      }
    }
  </style>
</head>
<body>
  <iframe class="header-frame" src="header.html" title="Goiburua"></iframe>

  <iframe class="navigation-frame" src="navigation.html" title="Nabigazio menua"></iframe>

  <iframe class="content-frame" src="content.html" name="contenido" title="Eduki nagusia"></iframe>

  <iframe class="footer-frame" src="footer.html" title="Orri-oina"></iframe>
</body>
</html>
