<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .frame-page {
      overflow: auto;
    }

    .footer-page {
      background: #f7c9a9;
    }

    .site-footer {
      display: grid;
      min-height: 100%;
      place-items: center;
      border-top: 2px solid #171717;
      color: #30251f;
      font-size: 1.25rem;
    }
  </style>
</head>
<body class="frame-page footer-page">
  <footer class="site-footer">PIE DE PÁGINA</footer>
</body>
</html>
