<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .frame-page {
      overflow: auto;
    }

    .navigation-page {
      background: #ffe69a;
    }

    .site-navigation {
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      padding: 0.5rem 1rem;
      border-bottom: 2px solid #171717;
    }

    .site-navigation h1 {
      margin: 0 0.5rem 0 0;
      font-size: 1rem;
    }

    .site-navigation a {
      padding: 0.65rem 0.85rem;
      border-radius: 0.35rem;
      color: #172033;
      font-size: 1rem;
      text-decoration: none;
    }

    .site-navigation a:hover,
    .site-navigation a:focus-visible {
      background: rgb(255 255 255 / 55%);
      text-decoration: underline;
    }

    @media (max-width: 620px) {
      .site-navigation {
        gap: 0.25rem;
        padding: 0.45rem;
      }

      .site-navigation a {
        padding: 0.55rem 0.65rem;
        font-size: 0.9rem;
      }

      .site-navigation h1 {
        width: 100%;
        margin: 0;
        text-align: center;
      }
    }
  </style>
</head>
<body class="frame-page navigation-page">
  <nav class="site-navigation" aria-label="Nabigazio menua">

    <a hidden href="content.html#kontaktua" target="contenido">Contacto</a>
    <a hidden href="content.html#acceso" target="contenido">Acceso de empleados</a>
  </nav>
</body>
</html>
