<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .frame-page {
      overflow: hidden;
    }

    .navigation-page {
      background: #fff;
    }

    .site-navigation {
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 0.25rem;
      padding: 0.5rem max(1.25rem, calc((100vw - 1200px) / 2));
      border-bottom: 1px solid #dfe5e1;
    }

    .site-navigation h1 {
      width: 100%;
      margin: 0 0 0.15rem;
      color: #68756e;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .site-navigation a {
      padding: 0.55rem 0.75rem;
      border-radius: 0.25rem;
      color: #68756e;
      font-size: 0.85rem;
      text-decoration: none;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .site-navigation a:hover,
    .site-navigation a:focus-visible {
      outline: none;
      background: #edf4ef;
      color: #276749;
    }

    .site-navigation a:focus-visible {
      box-shadow: 0 0 0 2px #276749;
    }

    @media (max-width: 640px) {
      .site-navigation {
        gap: 0.15rem;
        padding: 0.45rem 0.75rem;
      }

      .site-navigation a {
        padding: 0.5rem 0.6rem;
        font-size: 0.8rem;
      }

      .site-navigation h1 {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body class="frame-page navigation-page">
  <nav class="site-navigation" aria-label="Navegación principal">
    <h1>MENÚ PRINCIPAL</h1>
    <a href="content.html#inicio" target="contenido">Inicio</a>
    <a href="content.html#proiektua" target="contenido">Proyecto</a>
    <a href="content.html#kontaktua" target="contenido">Contacto</a>
    <a href="content.html#acceso" target="contenido">Acceso de empleados</a>
  </nav>
</body>
</html>
