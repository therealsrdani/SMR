<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b35">
  <title>Kalvex</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #26332d;
      grid-template-rows: 76px 76px minmax(400px, 1fr) 48px;
      background: #f7f8f7;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      background: #f7f8f7;
    }

    .header-frame,
    .navigation-frame,
    .footer-frame {
      grid-column: 1 / -1;
    }

    @media (max-width: 640px) {
      body {
        grid-template-rows: 72px 104px minmax(500px, 1fr) 48px;
      }
    }
  </style>
</head>
<body>
  <iframe class="header-frame" src="header.html" title="Cabecera del portal"></iframe>

  <iframe class="navigation-frame" src="navigation.html" title="Navegación principal"></iframe>

  <iframe class="content-frame" src="content.html" name="contenido" title="Contenido principal"></iframe>

  <iframe class="footer-frame" src="footer.html" title="Pie de página"></iframe>
</body>
</html>
