<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .frame-page {
      overflow: hidden;
    }

    .header-page {
      background: #fff;
    }

    .site-header {
      display: flex;
      min-height: 100%;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem max(1.25rem, calc((100vw - 1200px) / 2));
      border-bottom: 1px solid #dfe5e1;
      color: #26332d;
    }

    .brand-mark {
      display: grid;
      width: 2.5rem;
      height: 2.5rem;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 0.35rem;
      background: #276749;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .brand-name small {
      display: block;
      margin-top: 0.15rem;
      color: #68756e;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body class="frame-page header-page">
  <header class="site-header">
    <span class="brand-mark" aria-hidden="true">E</span>
    <span class="brand-name">[Empresa]<small>ESPACIO DE EQUIPO</small></span>
  </header>
</body>
</html>
