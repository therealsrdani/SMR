<html>
<head>
<title>EJERCICIO 9</title>
<style type="text/css">
  body {
    margin: 0;
    background-color: #33cbcc;
    font-family: "Times New Roman", Times, serif;
  }

  #contenedor {
    box-sizing: content-box;
    width: 750px;
    height: 480px;
    margin: 10px auto;
    border: 5px solid #000001;
    background-color: #cccccc;
  }

  #cabecera {
    background-color: #cccccc;
    border: 2px solid #000001;
    width: 720px;
    height: 60px;
    margin: 13px auto 12px;
    color: white;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cabecera h1 {
    margin: 0;
  }

  #caja2 {
    box-sizing: border-box;
    width: 724px;
    height: 94px;
    margin: 0 auto 12px;
    border: 2px solid #000001;
    background-color: #000001;
    color: #ffffff;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #caja2 p,
  #caja5 p {
    margin: 0;
  }

  #caja4 {
    box-sizing: border-box;
    width: 380px;
    height: 138px;
    margin: 0 0 11px 63px;
    border: 2px solid #000001;
    padding: 7px 0;
  }

  #caja4 ul {
    margin: 16px 0;
  }

  #caja5 {
    box-sizing: border-box;
    width: 725px;
    height: 123px;
    margin: 0 auto;
    border: 5px double #000001;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

</style>
</head>

<body>
<div id="contenedor">
  <div id="cabecera"><h1>Esta es la cabecera</h1></div>
  <div id="caja2"><p>Este es un contenedor con un estilo<br />
</p></div>

  <div id="caja4">
  <ul>
  <li>Elemento 1</li>
  <li>Elemento 2</li>
  <li>Elemento 3</li>
  <li>Elemento 4</li></ul>
  </div>
  <div id="caja5"><p>Pie de página</p></div>
</div>



</body>
</html>
