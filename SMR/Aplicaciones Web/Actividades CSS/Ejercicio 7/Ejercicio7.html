<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 7</title>
    <style>
      body {
        margin: 0;
        font-family: "Times New Roman", Times, serif;
      }

      h1 {
        margin: 24px 10px 25px;
        border: 3px dashed #000;
        background-color: #1196ad;
        color: #fff;
        font-size: 30px;
        text-align: center;
      }

      table {
        width: 50%;
        margin: 0 auto 20px;
        border: 1px solid #000;
        border-collapse: collapse;
        font-size: 19px;
      }

      th,
      td {
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: #1196ad;
        color: #fff;
      }

      tbody tr:nth-child(odd) {
        background-color: #c4c4c4;
      }

      .aviso {
        margin-top: 0;
        margin-right: 3%;
        margin-bottom: 0;
        margin-left: 3%;
        padding: 14px 12px;
        border-top: 1px solid #b5e9f1;
        border-right: 1px solid #b5e9f1;
        border-bottom: 1px solid #b5e9f1;
        border-left: 5px solid #1196ad;
        background-color: #d2f3fa;
        font-size: 19px;
      }
    </style>
  </head>
  <body>
    <h1>Notas de alumnos</h1>

    <table>
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Nota</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ane</td>
          <td>Etxeberria</td>
          <td>7</td>
        </tr>
        <tr>
          <td>Mikel</td>
          <td>Pérez</td>
          <td>8</td>
        </tr>
        <tr>
          <td>Rakel</td>
          <td>Rodríguez</td>
          <td>10</td>
        </tr>
        <tr>
          <td>Jon</td>
          <td>Brown</td>
          <td>6</td>
        </tr>
      </tbody>
    </table>

    <p class="aviso">Las notas se publicarán el viernes.</p>
  </body>
</html>
