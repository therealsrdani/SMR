<html>
<head>
<title>EJERCICIO 10</title>
<style type="text/css">
  body {
    margin: 0;
    background-color: #32ff98;
  }

  #contenedor {
    box-sizing: border-box;
    width: 670px;
    height: 640px;
    margin: 14px auto 0;
    border: 8px solid #000001;
    background-color: #000001;
  }

  #cabecera {
    height: 174px;
    border-bottom: 6px solid #000001;
    background-color: #cccccc;
  }

  #menu {
    height: 28px;
    margin-bottom: 10px;
    background-color: #cccccc;
  }

  #principal {
    display: grid;
    grid-template-columns: 136px 362px 140px;
    column-gap: 6px;
    height: 342px;
    background-color: #000001;
  }

  #col_izquierda {
    height: 202px;
    background-color: #ffcc00;
  }

  #col_centro {
    height: 269px;
    background-color: #32ff98;
  }

  #col_derecha {
    height: 335px;
    margin-left: 1px;
    background-color: #0099ff;
  }

  #pie {
    height: 69px;
    background-color: #cccccc;
  }

</style>
</head>

<body>
	<div id="contenedor">
      <div id="cabecera"></div>
      <div id="menu"></div>
      <div id="principal">
        <div id="col_izquierda"></div>
        <div id="col_centro"></div>
        <div id="col_derecha"></div>
      </div>
      <div id="pie"></div>
    </div>
</body>
</html>
