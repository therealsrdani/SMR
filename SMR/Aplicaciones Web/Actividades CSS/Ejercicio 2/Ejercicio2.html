<!DOCTYPE html>
<html lang="es">
<head>
    <title>EJERCICIO HTML + CSS: FUENTES</title>
    <meta charset="UTF-8" />
	<style>
	
	/*Propiedades que se tratan:
		--> font-style: normal | oblique | italic
		--> font-weight: 100-900 | normal | bold | lighter | bolder
		--> text-align: left | center | right | justify
		--> font-family: fuente(s)
		--> font-size: Número+ px | em | rem
		--> text-decoration: none | underline | overline | line-through
		--> background: color de fondo
	*/
	
	/*Contenedor span --> etiqueta "comodín" para aplicar estilos a partes concretas*/
	
	body {
		background-color: white;
	}
	p {
		background-color: #efefef;
	}
	#unico {
		background-color: #fad7a0;
		color: #9162f4;
		text-align: center;
	}
	p.p1 {
		background-color: #efefef;
		color: #ffa500;
		font-style: italic;
		font-family: Arial, sans-serif;
		font-size: 70px;
		text-align: left;
	}
	p.p2 {
		background-color: #efefef;
		color: #98f462;
		text-decoration: line-through;
	}
	p.p3 {
		background-color: #2c3e50;
		color: #138d75;
		font-weight: bold;
		text-decoration: overline;
		text-align: center;
	}
	span.destacado {
		background-color: #efefef;
		color: #e74c3c;
		font-weight: bolder;
	}
	p.p2.p4 {
		width: 50%;
		margin: auto;
	}
	</style>
</head>
<body>

<p> Párrafo normal </p>
<p id="unico"> Párrafo con ID </p>
<p class="p1"> Párrafo de clase p1 </p>
<p class="p2"> Párrafo de clase p2 </p>
<p class="p3"> Párrafo de clase p3 </p>

<p> ESTA ES UNA <span class="destacado"> PRUEBA </span></p>

<p class="p2 p4"> Párrafo con dos clases: p2 y p4 </p>

</body>
</html>
