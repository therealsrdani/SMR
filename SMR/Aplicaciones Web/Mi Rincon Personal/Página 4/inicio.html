<!DOCTYPE html>

    <title>Grand Theft Auto VI</title>

    <link rel="stylesheet" href="mrp4-iframes.css">
</head>
<body class="gta-contenido">
    <div class="gta-hero">
        <span class="gta-rockstar">
            ROCKSTAR GAMES
        </span>

            GRAND THEFT AUTO VI
