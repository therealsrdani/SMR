<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="stylesheet" href="mrp4-iframes.css">
</head>
<body class="iframe-contenido">
  <h1>CONTENIDO</h1>
  <p>Este es un párrafo con texto <strong>en negrita</strong>, <em>en cursiva</em> y <u>subrayado</u>.</p>

  <h2>Listas</h2>
  <ul>
    <li>Elemento sin orden 1</li>
    <li>Elemento sin orden 2</li>
  </ul>
  <ol>
    <li>Primer elemento ordenado</li>
    <li>Segundo elemento ordenado</li>
  </ol>

  <h2>Tabla</h2>
  <table>
    <tr><th>Columna 1</th><th>Columna 2</th></tr>
    <tr><td>Dato A</td><td>Dato B</td></tr>
  </table>

  <h2>Enlace</h2>
  <p><a href="https://www.google.com" target="_blank">Enlace externo de ejemplo</a></p>

  <h2>Formulario</h2>
  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <input type="submit" value="Enviar">
  </form>
</body>
</html>
